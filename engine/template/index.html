<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IAE Display"; src: url("assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "IAE Display"; src: url("assets/fonts/archivo-black-latin-ext-400-normal.woff2") format("woff2"); font-weight: 400; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "IAE Text"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "IAE Text"; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "IAE Text"; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      :root {
        --night: #12142b;
        --teal: #2ec4b6;
        --yellow: #ffd23f;
        --coral: #ff5a5f;
        --ink: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #ov { position: absolute; inset: 0; pointer-events: none; }

      #title-panel {
        position: absolute; left: 60px; top: 182px; width: 960px;
        padding: 22px 34px 28px; border-radius: 30px;
        background: rgba(10, 12, 32, 0.86); border: 5px solid var(--yellow);
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.35);
      }
      #pill-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .pill {
        font-family: "IAE Text"; font-weight: 900; font-size: 26px; letter-spacing: 0.06em;
        color: #0b0d1f; background: var(--teal); padding: 6px 16px; border-radius: 999px;
      }
      .pill-news { background: var(--coral); color: #fff; }
      #handle { font-family: "IAE Text"; font-weight: 800; font-size: 26px; color: rgba(255, 255, 255, 0.75); }
      #title { font-family: "IAE Display"; font-size: 74px; line-height: 1.08; color: var(--ink); letter-spacing: -0.01em; }

      #source {
        display: none; margin-top: 12px; font-family: "IAE Text"; font-weight: 800; font-size: 28px; color: #fff;
        background: var(--coral); padding: 6px 14px; border-radius: 12px; white-space: nowrap; width: max-content; max-width: 100%;
      }
      #hud { display: none; margin-top: 14px; align-items: center; gap: 16px; }
      #hud-label { font-family: "IAE Text"; font-weight: 900; font-size: 26px; color: #fff; letter-spacing: 0.08em; }
      #hud-bar { flex: 1; height: 24px; border-radius: 12px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
      #hud-fill { height: 100%; width: 0; border-radius: 12px; background: var(--teal); }
      #hud-val { min-width: 92px; text-align: right; font-family: "IAE Display"; font-size: 32px; color: var(--yellow); }

      #popup {
        position: absolute; left: 300px; top: 520px; width: 520px; border-radius: 20px; overflow: hidden;
        background: #f4f7fb; box-shadow: 0 16px 0 rgba(0, 0, 0, 0.35); opacity: 0; transform-origin: 30% 50%;
      }
      #popup .bar { background: var(--coral); padding: 10px 18px; display: flex; gap: 14px; align-items: center; }
      #popup .dots { color: rgba(255, 255, 255, 0.85); font-size: 22px; letter-spacing: 4px; }
      #popup-title { font-family: "IAE Text"; font-weight: 900; font-size: 30px; color: #fff; }
      #popup-text { padding: 18px 22px 22px; font-family: "IAE Text"; font-weight: 800; font-size: 38px; line-height: 1.15; color: #12142b; }

      #sticker {
        position: absolute; right: 70px; font-family: "IAE Display"; font-size: 92px; color: var(--yellow);
        -webkit-text-stroke: 14px #12142b; paint-order: stroke fill; opacity: 0; transform-origin: 50% 50%;
      }

      #speaker {
        position: absolute; left: 500px; top: 1060px; transform: translateX(-50%);
        font-family: "IAE Text"; font-weight: 900; font-size: 28px; letter-spacing: 0.1em;
        padding: 6px 18px; border-radius: 999px; opacity: 0;
      }
      .speaker.sp-lia { background: var(--teal); color: #0b0d1f; }
      .speaker.sp-user { background: #fff; color: #0b0d1f; }
      .speaker.sp-news { background: var(--coral); color: #fff; }

      #subs { position: absolute; left: 70px; top: 1150px; width: 860px; height: 170px; display: flex; align-items: center; justify-content: center; }
      .chunk {
        font-family: "IAE Text"; font-weight: 800; font-size: 62px; line-height: 1.18; text-align: center;
        color: #fff; letter-spacing: -0.01em; max-width: 860px;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.75), 0 4px 18px rgba(0, 0, 0, 0.55);
      }
      .chunk .w { display: inline-block; margin: 0 0.12em; opacity: 0; }
      #outro {
        position: absolute; left: 70px; top: 1120px; width: 860px; text-align: center; opacity: 0;
        font-family: "IAE Display"; font-size: 84px; color: #fff; -webkit-text-stroke: 14px #0b0d1f; paint-order: stroke fill;
        background: rgba(10, 12, 32, 0.78); border-radius: 28px; padding: 18px 10px 22px;
      }
      #outro small { display: block; font-family: "IAE Text"; font-weight: 900; font-size: 50px; color: var(--yellow); -webkit-text-stroke: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #alarm { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(255, 40, 60, 0) 35%, rgba(255, 40, 60, 0.95) 100%); }
      #scan { position: absolute; inset: 0; opacity: 0; background: repeating-linear-gradient(0deg, rgba(0, 255, 230, 0.12) 0 4px, rgba(0, 0, 0, 0) 4px 10px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="ov" data-layout-allow-overlap>
        <div id="alarm"></div>
        <div id="scan"></div>
        <div id="title-panel">
          <div id="pill-row"><span id="series-pill" class="pill"></span><span id="handle">@iaenapuros</span></div>
          <div id="title"></div>
          <div id="source"></div>
          <div id="hud"><div id="hud-label"></div><div id="hud-bar"><div id="hud-fill"></div></div><div id="hud-val"></div></div>
        </div>
        <div id="popup"><div class="bar"><span class="dots">● ● ●</span><span id="popup-title"></span></div><div id="popup-text"></div></div>
        <div id="sticker"></div>
        <div id="speaker" class="speaker"></div>
        <div id="subs"></div>
        <div id="outro">@iaenapuros<small>Síguela para más apuros</small></div>
        <div id="flash"></div>
      </div>
      <audio id="mix" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1" src="assets/audio.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({ v: 0 }, { v: 1, duration: {{DURATION}}, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script src="assets/episode-data.js"></script>
    <script src="assets/engine.js"></script>
  </body>
</html>
